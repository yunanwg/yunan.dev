name: Build and deploy

on:
  push:
    branches: [main]
    tags: ["v*"]   # a version tag builds, attests and publishes a release; it doesn't deploy
  pull_request:
  schedule:
    - cron: "17 5 * * 1"  # Mondays: refresh the GitHub counts on the page
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

# Actions are pinned to commit SHAs (the repository requires it); Dependabot moves the pins.
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write      # signs the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0  # full history: sitemap.xml dates the page by its last commit to site/
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      # Standard library only; fails on a broken budget, a missing glyph or a failed count.
      - run: python3 scripts/build.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # A signed statement, per file, that this dist/ was built from this commit by this workflow.
      # Check a file from the live site with:
      #   gh attestation verify FILE -R yunanwg/yunan.dev --signer-workflow yunanwg/yunan.dev/.github/workflows/deploy.yml
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        if: github.event_name != 'pull_request'
        with:
          subject-path: "dist/**"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: dist
          path: dist
          include-hidden-files: true  # .well-known/
          retention-days: 7

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # The Cloudflare token lives in this environment, which only main may deploy to.
    environment:
      name: production
      url: https://yunan.dev
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: dist
          path: dist
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0  # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.149.0"  # assets-only Workers need wrangler 4
          command: deploy

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write      # creates the release
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0  # release notes read the history since the previous tag
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: dist
          path: dist
      - name: Package the edition
        run: |
          tar -czf "yunan.dev-${GITHUB_REF_NAME}.tar.gz" -C dist .
          cp dist/yunan.1 yunan.1
          python3 scripts/release_notes.py "$GITHUB_REF_NAME" > notes.md
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-path: "yunan.dev-${{ github.ref_name }}.tar.gz"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "yunan.dev-${GITHUB_REF_NAME}.tar.gz" yunan.1 --title "yunan.dev $GITHUB_REF_NAME" --notes-file notes.md --verify-tag
