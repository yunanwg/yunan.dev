name: Check links

# A page about lasting shouldn't point at dead ones. Weekly, and by hand; a failure
# emails the owner and never blocks a deploy.
on:
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8  # v2.9.0
        with:
          # LinkedIn answers robots with 999. Mail addresses are skipped by default
          # (checked by hand); --root-dir resolves the root-relative links. Low-tech
          # Magazine's solar server drops out briefly when its battery runs low, so
          # a link gets a minute per try and 30 s between its three retries.
          args: --no-progress --timeout 60 --retry-wait-time 30 --accept 200..=299,429,999 --root-dir ${{ github.workspace }}/site site/index.html site/404.html
          fail: true
